[build]
command = "npm run build"
publish = ".next"
functions = "netlify/functions"

[env]
[env.production]
NODE_VERSION = "18"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.json"
[headers.values]
Cache-Control = "public, max-age=3600"

[context.production]
environment = { TMDB_API_KEY = "" }

# Nota: Netlify tiene límite de 10s en functions.
# Para volumen alto de usuarios, usa Vercel o Docker.
